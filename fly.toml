app = "fatihhekimoglu-api"
primary_region = "lhr"
kill_signal = "SIGINT"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  FH_FRONTEND_ORIGIN = "https://fatihhekimoglu.com"
  # Set FH_SUPABASE_URL and FH_SUPABASE_SERVICE_ROLE_KEY via `fly secrets set`

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2048mb"
  cpus = 1
