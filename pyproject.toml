[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fatihhekimoglu-api"
version = "0.1.0"
description = "Compute backend for the fatihhekimoglu.com tools platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Fatih Hekimoglu" }]
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "supabase>=2.7",
    # vendored from stock-dashboard requirements.txt (streamlit removed)
    "yfinance>=1.2",
    "curl_cffi>=0.7",
    "diskcache>=5.6",
    "plotly>=5.20",
    "pandas>=2.0",
    "numpy>=1.26",
    "pandas-market-calendars>=4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.7",
    "mypy>=1.11",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF", "N"]
ignore = ["N803", "N806", "E501"]

[tool.ruff.lint.per-file-ignores]
"api/tests/**/*.py" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "curl_cffi.*",
    "diskcache.*",
    "pandas_market_calendars.*",
    "plotly.*",
    "supabase.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["api/tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: tests that hit live external APIs (yfinance/Stooq)",
    "slow: tests >1s",
]
