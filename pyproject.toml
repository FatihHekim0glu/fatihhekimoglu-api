[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fatihhekimoglu-api"
version = "0.1.0"
description = "Compute backend for the fatihhekimoglu.com tools platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Fatih Hekimoglu" }]
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "supabase>=2.7",
    # vendored from stock-dashboard requirements.txt (streamlit removed)
    "yfinance>=1.2",
    "curl_cffi>=0.7",
    "diskcache>=5.6",
    "plotly>=5.20",
    "pandas>=2.0",
    "numpy>=1.26",
    "pandas-market-calendars>=4.4",
    # vendored from ma-crossover-backtest
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pyarrow>=15.0",
    # vendored from Stock Price Forecast requirements.txt (matplotlib + streamlit + apscheduler removed)
    "scikit-learn>=1.3",
    "ta>=0.11",
    "tensorflow>=2.16",
    # vendored from pairs-trading
    "pyyaml>=6.0",
    "pydantic-settings>=2.7",
    "platformdirs>=4.3",
    # vendored from factorlab pyproject.toml (streamlit removed)
    "pandas-datareader>=0.10",
    "requests>=2.31",
    "openpyxl>=3.1",
    # vendored from markowitz-optimizer (scipy + scikit-learn already pinned above)
    "cvxpy>=1.5,<2.0",
    # vendored from lendingclub-default (scikit-learn already pinned above; no shap/[all])
    "xgboost>=2.0",
    # vendored from crypto-arb-scanner (lean [data]; NO ccxt[all]). ccxt is imported
    # lazily inside the handler; any upstream failure degrades to synthetic.
    "ccxt>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.7",
    "mypy>=1.11",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF", "N"]
ignore = ["N803", "N806", "E501"]

[tool.ruff.lint.per-file-ignores]
"api/tests/**/*.py" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "curl_cffi.*",
    "diskcache.*",
    "pandas_market_calendars.*",
    "plotly.*",
    "supabase.*",
    "scipy.*",
    "statsmodels.*",
    "ma_backtester.*",
    "sklearn.*",
    "ta.*",
    "tensorflow.*",
    "stockclusters.*",
    "xgboost.*",
    "joblib.*",
    "lendingclub_default.*",
    "cryptoarb.*",
    "ccxt.*",
    "regimehmm.*",
    "anomaly_detector.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["api/tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: tests that hit live external APIs (yfinance/Stooq)",
    "slow: tests >1s",
    "unit: pure unit tests; no I/O, <2s each",
]
