[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fatihhekimoglu-api"
version = "0.1.0"
description = "Compute backend for the fatihhekimoglu.com tools platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Fatih Hekimoglu" }]
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "supabase>=2.7",
    # vendored from stock-dashboard requirements.txt (streamlit removed)
    "yfinance>=1.2",
    "curl_cffi>=0.7",
    "diskcache>=5.6",
    "plotly>=5.20",
    "pandas>=2.0",
    "numpy>=1.26",
    "pandas-market-calendars>=4.4",
    # vendored from ma-crossover-backtest
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pyarrow>=15.0",
    # vendored from Stock Price Forecast requirements.txt (matplotlib + streamlit + apscheduler removed)
    "scikit-learn>=1.3",
    "ta>=0.11",
    "tensorflow>=2.16",
    # vendored from pairs-trading
    "pyyaml>=6.0",
    "pydantic-settings>=2.7",
    "platformdirs>=4.3",
    # vendored from factorlab pyproject.toml (streamlit removed)
    "pandas-datareader>=0.10",
    "requests>=2.31",
    "openpyxl>=3.1",
    # vendored from markowitz-optimizer (scipy + scikit-learn already pinned above)
    "cvxpy>=1.5,<2.0",
    # vendored from lendingclub-default (scikit-learn already pinned above; no shap/[all])
    "xgboost>=2.0",
    # vendored from volforecast [data] extra: GARCH family via arch. XGBoost is
    # already pinned above; NO tensorflow (the volforecast LSTM arm is research-
    # only and is NEVER imported on this serve path).
    "arch>=6",
    # vendored from crypto-arb-scanner (lean [data]; NO ccxt[all]). ccxt is imported
    # lazily inside the handler; any upstream failure degrades to synthetic.
    "ccxt>=4",
    # vendored from lstm-forecast: ONNX serving ONLY (the [serve] extra). The
    # lstm-forecast router imports NO TensorFlow — inference runs through
    # onnxruntime against the committed <5MB synthetic-trained ONNX artifact.
    "onnxruntime>=1.17",
    # vendored from finbert-sentiment [serve] extra: the DistilBERT fine-tune is
    # served as a committed ONNX graph via onnxruntime (already pinned above) plus
    # the HF `tokenizers` library for the tokenizer.json. NO torch, NO transformers
    # on this serve path; the lexicon baseline is the torch-free fallback.
    "tokenizers>=0.20",
    # vendored from rag-10k [serve]: the GENERATIVE answer path lazily constructs an
    # Anthropic client ONLY when ANTHROPIC_API_KEY is set (generation is opt-in via
    # mode="generative"); retrieval + the extractive default never import it.
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.7",
    "mypy>=1.11",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored compute libraries under api/lib are imported byte-for-byte from
# their source repos and must never be edited here, so they are out of scope
# for our lint pass. We only lint the app layer (routers, config, tests).
extend-exclude = ["api/lib"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF", "N"]
# N803/N806: maths code uses capitalised identifiers (X design matrix, etc.).
# E501: line length is enforced by the formatter, not the linter.
# B008: FastAPI's Depends(...) in argument defaults is the documented pattern.
ignore = ["N803", "N806", "E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"api/tests/**/*.py" = ["S101", "PLR2004"]
# Vendored stock-dashboard source tests are bridged in byte-for-byte; their
# nested-class self naming and other upstream quirks are out of our scope.
"api/tests/lib/**/*.py" = ["N805"]

[tool.mypy]
python_version = "3.11"
# strict is left off to match the gold-standard reference (factorlab). The
# app injects untyped Supabase clients through FastAPI Depends and pulls in
# sys.path-vendored compute packages, neither of which carry stubs, so full
# strict typing would be noise rather than signal.
strict = false
warn_return_any = true
warn_unused_ignores = true
files = ["api"]
# Vendored libraries are typed (or not) by their upstream repos; exclude them
# and the test suite, mirroring the reference's src-only scope.
exclude = ["api/lib/", "api/tests/"]

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "curl_cffi.*",
    "diskcache.*",
    "pandas_market_calendars.*",
    "pandas.*",
    "plotly.*",
    "supabase.*",
    "scipy.*",
    "statsmodels.*",
    "ma_backtester.*",
    "sklearn.*",
    "ta.*",
    "tensorflow.*",
    "stockclusters.*",
    "xgboost.*",
    "joblib.*",
    "lendingclub_default.*",
    "cryptoarb.*",
    "ccxt.*",
    "regimehmm.*",
    "anomaly_detector.*",
    "lstmforecast.*",
    "mvtsforecast.*",
    "nnvsbs.*",
    "onnxruntime.*",
    "tokenizers.*",
    "volforecast.*",
    "arch.*",
    "wsb_sentiment.*",
    "finbert_sentiment.*",
    "edgar_nlp.*",
    "gnnstocks.*",
    "fedcausal.*",
    "rltrader.*",
    "rlallocator.*",
    "algosystem.*",
    "rag10k.*",
    # sys.path-vendored compute packages resolved at import time.
    "hrp.*",
    "markowitz.*",
    "pairs.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["api/tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: tests that hit live external APIs (yfinance/Stooq)",
    "slow: tests >1s",
    "unit: pure unit tests; no I/O, <2s each",
    "integration: hits live data; skip by default",
]

[tool.coverage.run]
branch = true
source = ["api"]
omit = [
    # Vendored compute libraries are tested in their own repos; we measure the
    # app layer (routers, config, deps) here, not the imported source trees.
    "api/lib/*",
    "api/tests/*",
    # Plotting helpers render Plotly/figure JSON and carry no testable logic.
    "*/plots.py",
    "*/charts.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 85
